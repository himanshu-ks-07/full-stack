<main>
  <form>
    <h2>Checkout Details</h2>
    <div class="form-group"><label>Full Name</label><input type="text" required></div>
    <div class="form-group"><label>Address</label><input type="text" required></div>
    <div class="form-group"><label>City</label><input type="text" required></div>
    <div class="form-group"><label>Pincode</label><input type="text" required></div>
    <div class="form-group"><label>Phone</label><input type="tel" required></div>
    <div class="form-group">
      <label>Payment Method</label>
      <input type="radio" name="pay" id="cod" checked> <label for="cod" style="display:inline;">Cash on Delivery</label><br>
      <input type="radio" name="pay" id="online"> <label for="online" style="display:inline;">Online Payment</label>
    </div>
    <button type="submit" class="btn">Place Order</button>
  </form>
</main>
