<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout - Mini E-Commerce</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <a href="index.html">MyStore</a>
    <div>
      <a href="products.html">Products</a>
      <a href="cart.html">Cart (<span id="cart-badge">0</span>)</a>
    </div>
  </nav>

  <div class="container">
    <h2 style="margin-bottom: 20px;">Checkout</h2>

    <form id="checkout-form" style="max-width: 500px; background: #fff; padding: 20px; border-radius: 8px;">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name">
        <span class="error-msg" id="name-error"></span>
      </div>

      <div class="form-group">
        <label for="address">Delivery Address</label>
        <textarea id="address" rows="3"></textarea>
        <span class="error-msg" id="address-error"></span>
      </div>

      <div class="form-group">
        <label for="pincode">Pincode (6 digits)</label>
        <input type="text" id="pincode">
        <span class="error-msg" id="pincode-error"></span>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number (10 digits)</label>
        <input type="text" id="phone">
        <span class="error-msg" id="phone-error"></span>
      </div>

      <button type="submit" style="width: 100%; margin-top: 10px;">Place Order</button>
    </form>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
